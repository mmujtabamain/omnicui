name: android
language: kotlin
# The app under test: examples/todo/apps/android (its `ui` library), an included Gradle build.
# This folder only mounts its screens under Robolectric and answers omnicui's requests.
#
# Gradle is not started here. Build once with ./setup.sh: it compiles the adapter and writes the
# exact classpath into build/adapter.args. Each check then starts one plain JVM, which keeps one
# Robolectric sandbox for the whole run (about 13 s to start, measured in setup.sh).
adapter: exec java -Xmx2g -XX:+UseParallelGC @build/adapter.args omnicui.android.Main
platform: [mobile]
os: android
# A phone layout in Material 3: compared with the desktop web app by what each part promises to
# keep the same (same: in the contracts), not pixel by pixel.
design: material
stepTimeout: 30s
startTimeout: 120s
