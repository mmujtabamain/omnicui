# Inputs that each platform performs its own way. A step `{ input: back }` is sent to each target
# in its platform's form (the most specific selector wins: target > OS > form > design > default).
inputs:
  # "Go back one screen": the system back on phones, the browser's back on the web, the
  # keyboard shortcut on desktops.
  back:
    default: { key: Alt+ArrowLeft }
    macos:   { key: Meta+BracketLeft }
    android: { do: back }
    ios:     { do: back }
    web:     { do: back }
