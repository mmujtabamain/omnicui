# Inputs that each desktop platform performs its own way. A step `{ input: back }` is sent to
# each target in its platform's form.
inputs:
  # "Go back": the browser's back button on the web, Cmd+[ in a Mac app.
  back:
    default: { key: Alt+ArrowLeft }
    web:     { do: back }
    macos:   { key: Meta+BracketLeft }
