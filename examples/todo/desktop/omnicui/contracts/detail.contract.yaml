# yaml-language-server: $schema=../../../../../tools/omnicui/schema/contract.schema.json
# One task's detail, the pane beside the list (desktop/SPEC-APP.md, "todo.detail"): its title and
# notes, edited in place, the Done switch, Delete, and Close.
id: todo.detail

props:
  seed:   { type: string, enum: [empty, three, many], default: three }
  taskId: { type: string, default: t1 }

events:
  renamed:      { id: { type: string }, title: { type: string } }
  notesChanged: { id: { type: string }, notes: { type: string } }
  toggled:      { id: { type: string }, done: { type: boolean } }
  deleted:      { id: { type: string } }
  closed:       { id: { type: string } }

parts:
  title: { role: textbox, same: [layout] }   # a text field: an HTML input, an NSTextField on a Mac
  notes: { role: textbox, same: [layout] }   # a text field: an HTML input, an NSTextField on a Mac
  done: { role: switch, same: [layout] }   # a switch: a web toggle, an NSSwitch on a Mac
  delete:     { role: button }
  detailBack: { role: button }

tests:
  - name: shows the task
    props: { taskId: t3 }
    expect:
      - { part: title, text: "Book train tickets", name: "Title" }
      - { part: notes, text: "Friday 18:05 to Leeds", name: "Notes" }
      - { part: done, checked: false, name: "Done" }
      - { part: delete, name: "Delete" }
      - { part: detailBack, name: "Close" }
    screenshot: true

  - name: a done task with no notes
    props: { taskId: t2 }
    expect:
      - { part: title, text: "Call the plumber" }
      - { part: notes, text: "" }
      - { part: done, checked: true }
    screenshot: true

  - name: the Done switch marks it done
    steps:
      - { action: press, part: done }
    expect:
      - { part: done, checked: true }
      - { event: toggled, times: 1, last: { id: "t1", done: true } }

  - name: and back again
    props: { taskId: t2 }
    steps:
      - { action: press, part: done }
    expect:
      - { part: done, checked: false }
      - { event: toggled, times: 1, last: { id: "t2", done: false } }

  - name: typing in the title renames it, at every change
    steps:
      - { action: type, part: title, text: " today" }
    expect:
      - { part: title, text: "Buy milk today" }
      - { event: renamed, last: { id: "t1", title: "Buy milk today" } }
      - { event: notesChanged, times: 0 }

  - name: typing in the notes changes them
    props: { taskId: t2 }
    steps:
      - { action: type, part: notes, text: "Boiler, Tuesday" }
    expect:
      - { part: notes, text: "Boiler, Tuesday" }
      - { event: notesChanged, last: { id: "t2", notes: "Boiler, Tuesday" } }
      - { event: renamed, times: 0 }

  - name: Delete reports the task deleted
    props: { taskId: t3 }
    steps:
      - { action: press, part: delete }
    expect:
      - { event: deleted, times: 1, last: { id: "t3" } }
      - { event: closed, times: 0 }

  - name: leaving it reports it closed
    props: { taskId: t3 }
    steps:
      - { action: press, part: detailBack }
    expect:
      - { event: closed, times: 1, last: { id: "t3" } }
      - { event: deleted, times: 0 }

  - name: Space flips the focused switch
    steps:
      - { action: focus, part: done }
      - { action: key, part: done, key: Space }
    expect:
      - { part: done, checked: true, focused: true }
      - { event: toggled, times: 1, last: { id: "t1", done: true } }

viewports: [{ width: 1024, height: 720 }]
colorSchemes: [light, dark]
# The web and macOS apps share one product design (design/DESIGN-DESKTOP.md): the same regions in
# the same proportions and the same palette, each drawn the way its platform draws it. So every
# part keeps its layout, colours and motion between them, never its pixels; a part that each
# platform draws as its own native control keeps only its layout (`same: [layout]` below).
same: [layout, colours, motion]
keyboard: true
