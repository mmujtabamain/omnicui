# Inputs that each phone performs its own way. A step `{ input: back }` is sent to each target in
# its platform's form.
inputs:
  # "Go back one screen": Android's system back; on iOS, the navigation bar's back button or the
  # edge swipe, whichever the iOS target implements as `do: back`.
  back:
    default: { do: back }
    android: { do: back }
    ios:     { do: back }
