# yaml-language-server: $schema=../../../../../tools/omnicui/schema/contract.schema.json
# The phone's settings screen (mobile/SPEC-APP.md, "todo.settings"): the theme, as a segmented control, and whether the
# list's All filter shows completed tasks. The theme applies at once, to this screen too.
id: todo.settings

props:
  theme:         { type: string, enum: [system, light, dark], default: system }
  showCompleted: { type: boolean, default: true }

events:
  themeChanged:         { theme: { type: string, enum: [system, light, dark] } }
  showCompletedChanged: { show: { type: boolean } }
  closed:               {}

parts:
  themeSystem:   { role: button }
  themeLight:    { role: button }
  themeDark:     { role: button }
  showCompleted: { role: switch }
  settingsBack:  { role: button }

tests:
  - name: starts from the system theme, with completed tasks shown
    expect:
      - { part: themeSystem, selected: true, text: "System" }
      - { part: themeLight, selected: false, text: "Light" }
      - { part: themeDark, selected: false, text: "Dark" }
      - { part: showCompleted, checked: true, name: "Show completed" }
      - { part: settingsBack, name: "Back" }
    screenshot: true

  - name: choosing Dark selects it, reports it and darkens the screen
    steps:
      - { action: press, part: themeDark }
    expect:
      - { part: themeDark, selected: true }
      - { part: themeSystem, selected: false }
      - { event: themeChanged, times: 1, last: { theme: dark } }
    screenshot: true

  - name: a Light theme stays light whatever the system's scheme
    props: { theme: light }
    expect:
      - { part: themeLight, selected: true }
      - { part: themeSystem, selected: false }
    screenshot: true

  - name: choosing the theme already chosen reports nothing
    steps:
      - { action: press, part: themeSystem }
    expect:
      - { part: themeSystem, selected: true }
      - { event: themeChanged, times: 0 }

  - name: Show completed turns off
    steps:
      - { action: press, part: showCompleted }
    expect:
      - { part: showCompleted, checked: false }
      - { event: showCompletedChanged, times: 1, last: { show: false } }

  - name: and on again
    props: { showCompleted: false }
    steps:
      - { action: press, part: showCompleted }
    expect:
      - { part: showCompleted, checked: true }
      - { event: showCompletedChanged, times: 1, last: { show: true } }

  - name: leaving reports it
    steps:
      - { action: press, part: settingsBack }
    expect:
      - { event: closed, times: 1 }
      - { event: themeChanged, times: 0 }

  - name: Enter chooses the focused segment
    steps:
      - { action: focus, part: themeLight }
      - { action: key, part: themeLight, key: Enter }
    expect:
      - { part: themeLight, selected: true, focused: true }
      - { event: themeChanged, times: 1, last: { theme: light } }

viewports: [{ width: 360, height: 640 }]
colorSchemes: [light, dark]
# Android and iOS are each entirely native (Material 3, and the iOS system look): only behaviour
# is held the same between them, never pixels, colours, layout or motion. Screenshots are taken
# for people to look at, not compared.
same: none
keyboard: true
