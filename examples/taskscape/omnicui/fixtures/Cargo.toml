[package]
name = "taskscape-fixtures"
version = "0.1.0"
edition = "2021"
description = "Loads the Taskscape example's fixtures through taskscape_common's Store into a fresh, temporary data folder"
publish = false

[lib]
name = "taskscape_fixtures"
path = "src/lib.rs"

[[bin]]
name = "taskscape-fixture"
path = "src/main.rs"

[dependencies]
taskscape-common = { path = "../../tauri/common" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
