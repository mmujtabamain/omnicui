[package]
name = "taskscape-target-desktop"
version = "0.1.0"
edition = "2024"
description = "omnicui's desktop target for Taskscape: mounts the egui app's widgets and screens headlessly with egui_kittest and answers omnicui's requests, reading AccessKit."
publish = false

[workspace]
members = ["stubs"]

[[bin]]
name = "adapter"
path = "src/main.rs"

[dependencies]
taskscape-ui = { path = "../../../apps/desktop/ui" }
egui = "0.37"
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1"

[profile.release]
debug = false
