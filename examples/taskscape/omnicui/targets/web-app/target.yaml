name: web-app
language: typescript
# The screens of apps/web/frontend in Chromium (Playwright), on the real API with demo data. Shares
# the web target's adapter, in app mode. Needs SCREENS_DATABASE_URL (a Postgres server) and, unless
# python3 has the backend's requirements, TASKSCAPE_PYTHON.
adapter: exec node --experimental-strip-types ../web/adapter.ts app
platform: [web]
design: web
stepTimeout: 20s
startTimeout: 180s
