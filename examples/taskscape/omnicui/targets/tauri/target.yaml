name: tauri
language: typescript
# The app under test: examples/taskscape/tauri, the Taskscape Tauri app (main window and the
# tray's capture bar), run as its real frontend in Chromium (Playwright) because macOS's
# WKWebView has no WebDriver. Its Tauri commands are answered by server/ (Rust) with the app's
# own taskscape_common Store, on a fresh database the fixture loader writes for every mount.
# Set up once: ./setup.sh here (npm installs, the icon subset, the harness and server builds).
#
# omnicui runs `adapter:` once per check, with /bin/sh -c, and talks JSON-RPC to it over
# stdin/stdout. `exec` hands the shell's place to the adapter, so that closing its output is
# seen at once.
adapter: exec node adapter.ts
# The reference: Taskscape's own design, drawn by the webview. gpui and web are idiomatic
# versions of it, compared by layout, colours and motion (the contracts' `same:`).
design: tauri
platform: [desktop]
stepTimeout: 20s
startTimeout: 120s
