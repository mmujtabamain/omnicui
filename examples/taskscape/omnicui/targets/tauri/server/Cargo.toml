[package]
name = "taskscape-tauri-target-server"
version = "0.1.0"
edition = "2021"
description = "The tauri target's backend: the Taskscape app's Tauri commands, answered by taskscape_common's Store over HTTP, for the frontend running in Chromium"
publish = false

[dependencies]
taskscape-common = { path = "../../../../tauri/common" }
taskscape-fixtures = { path = "../../../fixtures" }
anyhow = "1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
