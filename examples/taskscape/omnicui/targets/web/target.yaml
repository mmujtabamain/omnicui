name: web
language: typescript
# The app under test: examples/taskscape/web, Taskscape for the web: the Tauri app's React
# frontend built for a browser, and its Rust server (taskscape_common's Store over HTTP). The
# adapter runs the server with its test hooks (a fresh fixture per mount, the domain events it
# wrote) and drives the built app in Chromium (Playwright), on this host as it is.
# Set up once: ./setup.sh here (the app's npm packages and icon subset, its build with the
# omnicui page, the server with the test-hooks feature, Chromium). Nothing is built per check.
#
# omnicui runs `adapter:` once per check, with /bin/sh -c, and talks JSON-RPC to it over
# stdin/stdout. `exec` hands the shell's place to the adapter, so that closing its output is
# seen at once.
adapter: exec node adapter.ts
# A web app of the same product: compared with tauri by layout, colours and motion (the
# contracts' `same:`), never by pixels.
design: web
platform: [web]
stepTimeout: 20s
startTimeout: 120s
