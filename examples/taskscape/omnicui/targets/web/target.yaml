name: web
language: typescript
# The widget library (packages/ui) in Chromium (Playwright). This folder only mounts each widget
# through its harness entry and answers omnicui's requests. Set up once, from examples/taskscape:
# `npm install`, then `npx playwright install chromium`.
adapter: exec node --experimental-strip-types adapter.ts
platform: [web]
design: web
stepTimeout: 15s
startTimeout: 120s
