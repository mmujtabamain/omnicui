[package]
name = "taskscape-gpui-target"
version = "0.1.0"
edition = "2021"
description = "The gpui target's adapter: mounts Taskscape's GPUI views for omnicui"
publish = false

[[bin]]
name = "taskscape-gpui-adapter"
path = "src/main.rs"

[dependencies]
taskscape-gpui = { path = "../../../gpui" }
taskscape-fixtures = { path = "../../fixtures" }
gpui = "=0.2.2"
anyhow = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
image = "0.25"
libc = "0.2"
log = "0.4"

# The same profiles as the app's (../../../gpui/Cargo.toml), so that the build is shared.
[profile.dev]
opt-level = 1
# Line tables only, and no incremental cache: the build folder stays a few GB.
debug = "line-tables-only"
incremental = false
[profile.dev.package."*"]
opt-level = 2
debug = false
