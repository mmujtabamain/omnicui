# Inputs whose form depends on the platform: a test step `{ input: newTask }` is sent to each
# target in its own form. From the hotkey catalog (tauri/common/src/hotkeys.rs, the frontend
# twin tauri/common-ui/src/hotkeys.ts), where every default is a ⌘ chord.
#
# - default: the desktop app on macOS, ⌘ (Meta) as the app ships. The tauri target and the GPUI
#   port take these.
# - web: a page can't have the browser's own chords. Chromium keeps ⌘N/Ctrl+N (new window),
#   ⌘T, ⌘W, ⌘L, ⌘1–9 (switch tabs), ⌘⇧N, and Alt/⌘+arrows (history); none of them reach the
#   page. Those get an Alt chord, and the rest Ctrl, which is what a page in a browser on Linux
#   or Windows uses (the web target runs Chromium on Linux). A web port on a Mac may show ⌘ for
#   the Ctrl ones; these are the chords its tests send. Alt chords: match on `code`, not `key`
#   (on macOS, Option+N is a dead key that types nothing).
# - none: there is no such thing on that platform; a test that uses it is not applicable there.
#
# Letters are lower case (a code, KeyN), so that no Shift is implied.
inputs:
  # A new task in the focused list (catalog: new_task, Cmd+N).
  newTask:
    default: { key: Meta+n }
    web:     { key: Alt+n }
  # The command palette (command_palette, Cmd+K).
  palette:
    default: { key: Meta+k }
    web:     { key: Control+k }
  # Search the focused list (search, Cmd+F).
  search:
    default: { key: Meta+f }
    web:     { key: Control+f }
  # Delete the focused task or the selection, after asking (delete_task, Cmd+Backspace).
  deleteTask:
    default: { key: Meta+Backspace }
    web:     { key: Control+Backspace }
  # Mark the focused task done or not done. The catalog has no binding for it: the app does it
  # with ⌥Space (useAppKeyboard.ts), on every platform alike.
  toggleDone:
    default: { key: Alt+Space }
  # Undo the last change (undo, Cmd+Z).
  undo:
    default: { key: Meta+z }
    web:     { key: Control+z }
  # Show or hide the preview rail (toggle_preview, Cmd+\).
  togglePreview:
    default: { key: Meta+Backslash }
    web:     { key: Control+Backslash }
  # Settings (open_settings, Cmd+,).
  openSettings:
    default: { key: Meta+Comma }
    web:     { key: Control+Comma }
  # The next and previous list tab (next_tab, prev_tab: Cmd+Alt+Right/Left). Alt and ⌘ with the
  # arrows are the browser's history.
  nextList:
    default: { key: Meta+Alt+ArrowRight }
    web:     { key: Control+Alt+ArrowRight }
  prevList:
    default: { key: Meta+Alt+ArrowLeft }
    web:     { key: Control+Alt+ArrowLeft }
  # The second list tab (switch_list_2, Cmd+2). ⌘2/Ctrl+2 is the browser's second tab.
  switchList2:
    default: { key: Meta+2 }
    web:     { key: Alt+2 }
  # A new list (new_list, Cmd+Shift+N). ⌘⇧N/Ctrl+Shift+N is the browser's private window.
  newList:
    default: { key: Meta+Shift+n }
    web:     { key: Alt+Shift+n }
  # Select every task in the focused list (select_all, Cmd+A).
  selectAll:
    default: { key: Meta+a }
    web:     { key: Control+a }
  # Move the focused task down among its siblings (move_down, Cmd+Alt+Down).
  moveDown:
    default: { key: Meta+Alt+ArrowDown }
    web:     { key: Control+Alt+ArrowDown }
  # Show or hide done tasks (toggle_completed, Cmd+Shift+H).
  toggleCompleted:
    default: { key: Meta+Shift+h }
    web:     { key: Control+Shift+h }
  # The capture bar's own: clear the draft (clear_draft, Cmd+Shift+Backspace). The capture bar is
  # desktop only (a menu-bar agent); its tests say `only: [desktop]`.
  clearDraft:
    default: { key: Meta+Shift+Backspace }
    web:     none
  # Answer the question on screen (a sheet): Enter accepts, Escape dismisses, wherever focus is.
  confirm:
    default: { key: Enter }
  dismiss:
    default: { key: Escape }
  # Settings > Shortcuts: a chord no command has, to record (Cmd is the primary modifier: ⌘ on a
  # Mac, Ctrl off one; the catalog spells both "Cmd").
  recordShortcut:
    default: { key: Meta+Shift+j }
    web:     { key: Control+Shift+j }
