# Named inputs: each platform's form of the same intent.
inputs:
  # selectToggle is the keyboard form (on the focused row). selectHold and modifierHold hold their
  # key for the steps that follow (a Ctrl/Cmd-click, an Option-hover), as a user holds it while pointing.
  selectToggle: { default: { key: Control+Space }, macos: { key: Meta+Space } }
  selectHold: { default: { key: Control }, macos: { key: Meta }, web: { do: holdSelect } }
  modifierHold: { default: { key: Alt }, macos: { key: Alt }, web: { do: holdModifier } }
  confirm: { default: { key: Enter } }
  dismiss: { default: { key: Escape } }
  toggleBold: { default: { key: Control+B }, macos: { key: Meta+B } }
  toggleItalic: { default: { key: Control+I }, macos: { key: Meta+I } }
  toggleUnderline: { default: { key: Control+U }, macos: { key: Meta+U } }
  submit: { default: { key: Control+Enter }, macos: { key: Meta+Enter } }
  toggleDone: { default: { key: Control+Enter }, macos: { key: Meta+Enter } }
  # App commands: the platform modifier on the desktop (Command on macOS, Control elsewhere); the web
  # remaps the chords the browser keeps for itself (decision 18).
  nextProject: { default: { key: Control+Shift+BracketRight }, macos: { key: Meta+Shift+BracketRight }, web: { key: Alt+Shift+BracketRight } }
  prevProject: { default: { key: Control+Shift+BracketLeft }, macos: { key: Meta+Shift+BracketLeft }, web: { key: Alt+Shift+BracketLeft } }
  newList: { default: { key: Control+Shift+KeyN }, macos: { key: Meta+Shift+KeyN }, web: { key: Alt+Shift+KeyN } }
  nextList: { default: { key: Control+Alt+ArrowRight }, macos: { key: Meta+Alt+ArrowRight }, web: { key: Alt+Shift+ArrowRight } }
  prevList: { default: { key: Control+Alt+ArrowLeft }, macos: { key: Meta+Alt+ArrowLeft }, web: { key: Alt+Shift+ArrowLeft } }
  switchList2: { default: { key: Control+Digit2 }, macos: { key: Meta+Digit2 }, web: { key: Alt+Digit2 } }
  newTask: { default: { key: Control+KeyN }, macos: { key: Meta+KeyN }, web: { key: Alt+KeyN } }
  search: { default: { key: Control+KeyF }, macos: { key: Meta+KeyF }, web: { key: Slash } }
  undo: { default: { key: Control+KeyZ }, macos: { key: Meta+KeyZ } }
  selectAll: { default: { key: Control+KeyA }, macos: { key: Meta+KeyA } }
  commandPalette: { default: { key: Control+KeyK }, macos: { key: Meta+KeyK } }
  openSettings: { default: { key: Control+Comma }, macos: { key: Meta+Comma } }
  switchList3: { default: { key: Control+Digit3 }, macos: { key: Meta+Digit3 }, web: { key: Alt+Digit3 } }
  # Desktop only: the capture bar's chords, its global hotkeys and window closing.
  clearDraft: { default: { key: Control+Shift+Backspace }, macos: { key: Meta+Shift+Backspace }, web: none }
  toggleCaptureBar: { default: { key: Control+Enter }, macos: { key: Meta+Enter }, web: none }
  captureScreenshot: { default: { key: Control+Shift+Enter }, macos: { key: Meta+Shift+Enter }, web: none }
  closeWindow: { default: { key: Control+KeyW }, macos: { key: Meta+KeyW }, web: none }
  osClose: { default: { do: close }, web: none }   # the OS's own close button or Alt+F4: a target action, since the app draws no close control
