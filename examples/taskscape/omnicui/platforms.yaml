# Named inputs: each platform's form of the same intent.
inputs:
  # On the web both are held for the steps that follow (a Ctrl/Cmd-click, an Option-hover), as a
  # user holds the key while pointing.
  selectToggle: { default: { key: Control+Space }, macos: { key: Meta+Space }, web: { do: holdSelect } }
  modifierHold: { default: { key: Alt }, macos: { key: Alt }, web: { do: holdModifier } }
  confirm: { default: { key: Enter } }
  dismiss: { default: { key: Escape } }
  toggleBold: { default: { key: Control+B }, macos: { key: Meta+B } }
  toggleItalic: { default: { key: Control+I }, macos: { key: Meta+I } }
  toggleUnderline: { default: { key: Control+U }, macos: { key: Meta+U } }
  submit: { default: { key: Control+Enter }, macos: { key: Meta+Enter } }
