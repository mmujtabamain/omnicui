      - { part: groupHeadingReading, text: { contains: "Reading" } }
      - { part: rowReturnLibrary, text: { contains: "Return library books" } }
      - { part: rowBike, visible: true }
      - { part: searchCount, text: "3" }

  - name: "search options opens its menu and not the panel"
    props: { panel: closed }
    steps:
      - { action: press, part: searchOptions }
    expect:
      - { part: scopeWholeProject, visible: true }
      - { part: panelTitle, visible: false }

  - name: "the slash key focuses the search field"
    # Decision 18 (web): "/" focuses search when no text field has focus. The seed letter is not asserted.
    steps:
      - { action: focus, part: newTask }
      - { action: key, part: newTask, key: Slash }
    expect:
      - { part: searchField, focused: true }

