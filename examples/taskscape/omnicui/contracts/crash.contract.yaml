id: app.crash

# The crash screen: shown instead of a blank page when a screen throws while rendering. The error
# has already been reported to the server (api/client-errors) by then.

props:
  message: { type: string, default: "Something broke" }

events: {}

parts:
  reload: { role: button }

tests:
  - name: shows the error and a reload button
    props: { message: "Cannot read properties of undefined" }
    expect:
      - { part: reload, name: Reload }
    screenshot: true
