# yaml-language-server: $schema=../../../../tools/omnicui/schema/contract.schema.json
# The main window, whole (SPEC-PRODUCT.md, "taskscape.window"), as it opens at its default size,
# 1180×760: the title bar, the task pane (two in split view) and the preview rail, with the
# sheets, the palette and the toast over them. Its parts are its surfaces' parts, by the same
# names (names are unique across the product). The surfaces each have a contract of their own;
# this one holds the window's structure and the flows that cross from one surface to another.
id: taskscape.window

props:
  seed: { type: string, enum: [standard, empty, nolists], default: standard }

events:
  taskCreated:  { id: { type: string }, title: { type: string }, listId: { type: string }, parentId: { type: string } }
  taskTrashed:  { id: { type: string } }
  taskRestored: { id: { type: string } }
  taskCompleted: { id: { type: string }, done: { type: boolean } }
  settingChanged: { key: { type: string }, value: { type: string } }

parts:
  # The window's own controls: each desktop platform's; the web has none.
  windowControls:    { role: generic, optional: true, same: none }
  project:           { role: button }
  tab1Name:          { role: generic }
  tab2:              { role: button }
  splitView:         { role: button }
  search:            { role: textbox, same: [layout] }
  row1Title:         { role: generic }
  row5:              { role: button }
  row6:              { role: button }
  row6Title:         { role: generic }
  row9Title:         { role: generic }
  doneCount:         { role: status }
  previewEmptyTitle: { role: heading }
  inspector:         { role: generic }
  inspectorTitle:    { role: textbox, same: [layout] }
  draftTitle:        { role: textbox, same: [layout] }
  palette:           { role: generic }
  paletteInput:      { role: textbox, same: [layout] }
  sheet:             { role: generic }
  sheetHeadline:     { role: heading }
  toastMessage:      { role: status }
  toastAction:       { role: button }
  trashed1Title:     { role: generic }
  windowEmptyTitle:  { role: heading }
  row5Title:         { role: generic }

tests:
  - name: the window opens on the last list, with the drawer beside it
    expect:
      - { part: project, text: "Atlas" }
      - { part: tab1Name, text: "Launch plan" }
      - { part: search, name: "Search Launch plan" }
      - { part: row1Title, text: "Write the launch brief" }
      - { part: doneCount, text: "3/8 DONE" }
      - { part: previewEmptyTitle, text: "No task selected" }
    screenshot: true

  - name: a project with no lists says to create one
    props: { seed: nolists }
    expect:
      - { part: project, text: "Atlas" }
      - { part: windowEmptyTitle, text: "No lists yet" }
    screenshot: true

  - name: pressing a row shows the task in the drawer
    steps:
      - { action: press, part: row5 }
    expect:
      - { part: inspectorTitle, text: "Book the venue" }
    screenshot: true
    # tokens.css --animate-rise: the drawer's content rises in.
    trace:
      - { part: inspector, property: opacity }
    record: { part: inspector }

  - name: a tab shows its list in the pane
    steps:
      - { action: press, part: tab2 }
    expect:
      - { part: search, name: "Search Groceries" }
      - { part: row1Title, text: "Oat milk" }

  - name: split view shows the next list beside the first
    steps:
      - { action: press, part: splitView }
    expect:
      - { part: row1Title, text: "Write the launch brief" }
    screenshot: true

  - name: the palette opens over the window, and scales in
    steps:
      - { input: palette }
    expect:
      - { part: paletteInput, focused: true }
    screenshot: true
    trace:
      - { part: palette, property: opacity }
    record: { part: palette }

  - name: the palette reaches the Trash, which opens in the drawer
    steps:
      - { input: palette }
      - { action: type, part: paletteInput, text: "trash" }
      - { action: key, part: paletteInput, key: Enter }
    expect:
      - { part: trashed1Title, text: "Paint swatches" }
    screenshot: true

  - name: a new task starts as a draft in the drawer and lands at the end of the list
    steps:
      - { input: newTask }
      - { action: type, part: draftTitle, text: "Call the caterer" }
      - { action: key, part: draftTitle, key: Enter }
    expect:
      - { event: taskCreated, times: 1, last: { title: "Call the caterer", listId: launch, parentId: "" } }
      - { part: inspectorTitle, text: "Call the caterer" }
      - { part: row9Title, text: "Call the caterer" }
      - { part: doneCount, text: "3/9 DONE" }

  - name: deleting asks with a sheet, then the toast offers Undo
    steps:
      - { action: press, part: row6 }
      - { input: deleteTask }
      - { input: confirm }
    expect:
      - { event: taskTrashed, times: 1, last: { id: banners } }
      - { part: row6Title, text: "Send the invitations" }
      - { part: toastMessage, text: "Moved to Trash" }
    screenshot: true

  - name: the sheet scales in over the window
    steps:
      - { action: press, part: row6 }
      - { input: deleteTask }
    expect:
      - { part: sheetHeadline, text: "Move to Trash?" }
      - { event: taskTrashed, times: 0 }
    screenshot: true
    trace:
      - { part: sheet, property: opacity }
    record: { part: sheet }

  - name: Undo in the toast puts the task back in its place
    steps:
      - { action: press, part: row6 }
      - { input: deleteTask }
      - { input: confirm }
      - { action: press, part: toastAction }
    expect:
      - { event: taskRestored, times: 1, last: { id: banners } }
      - { part: row6Title, text: "Order the banners" }

  - name: the undo input does the same
    steps:
      - { action: press, part: row6 }
      - { input: toggleDone }
      - { input: undo }
    expect:
      - { event: taskCompleted, times: 2, last: { id: banners, done: false } }
      - { part: doneCount, text: "3/8 DONE" }

  - name: the toggle-completed input hides the done tasks, and remembers it
    steps:
      - { action: press, part: row6 }
      - { input: toggleCompleted }
    expect:
      - { event: settingChanged, times: 1, last: { key: show_completed, value: "0" } }
      - { part: row1Title, text: "Write the launch brief" }
      - { part: row5Title, text: "Send the invitations" }

  - name: a desktop window draws its own controls in the title bar
    only: [desktop]
    expect:
      - { part: windowControls, visible: true }

viewports: [{ width: 1180, height: 760 }]
colorSchemes: [light, dark]
same: [layout, colours, motion]
