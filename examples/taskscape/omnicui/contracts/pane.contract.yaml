# yaml-language-server: $schema=../../../../tools/omnicui/schema/contract.schema.json
# The task pane (SPEC-PRODUCT.md, "taskscape.pane"): one list's search well, its task tree and
# the footer that is either the stats bar or the bulk bar. It carries most of the product: this
# is where tasks are read, completed, nested, found and acted on.
#
# Rows are parts by position: row1 is the top row on screen, whichever task, and rowNTitle,
# rowNCheck, … are that row's pieces. Subtasks are rows too, under their parent, so with the
# standard fixture's launch plan expanded the rows are:
#   1 Write the launch brief (3 subtasks, 2 attachments)   5 Book the venue (done)
#   2   Collect the feature list (done)                     6 Order the banners
#   3   Draft the summary                                   7 Send the invitations (1 subtask)
#   4   Review with Sam                                     8   Confirm the guest list (done)
id: taskscape.pane

props:
  seed:          { type: string, enum: [standard, empty, long], default: standard }
  # The list the pane shows, by its fixture key.
  list:          { type: string, default: launch }
  # The app's Show completed setting (Settings > General), off hides done tasks.
  showCompleted: { type: boolean, default: true }
  # Tasks already in the pane's selection, by key, comma separated: the bulk bar's state.
  multi:         { type: string, default: "" }

events:
  taskCompleted:         { id: { type: string }, done: { type: boolean } }
  taskCreated:           { id: { type: string }, title: { type: string }, listId: { type: string }, parentId: { type: string } }
  taskMoved:             { id: { type: string }, listId: { type: string }, parentId: { type: string } }
  # A row pressed, or reached with the arrows: the task the inspector shows.
  taskFocused:           { id: { type: string } }
  taskExpanded:          { id: { type: string }, expanded: { type: boolean } }
  # The pane asks before it trashes anything; the question is its own component (taskscape.sheet).
  confirmAsked:          { headline: { type: string } }
  # "+" opens a draft in the inspector; no task exists until the draft has a title.
  draftOpened:           { listId: { type: string } }
  subtaskComposerOpened: { parentId: { type: string } }
  copied:                { text: { type: string } }
  filterToggled:         { open: { type: boolean } }

parts:
  search:        { role: textbox, same: [layout] }   # a text field: each platform draws its own
  matchCount:    { role: status }
  clearSearch:   { role: button }
  newTask:       { role: button }
  row1:          { role: button }
  row1Title:     { role: generic }
  row1Notes:     { role: generic }
  row1Check:     { role: button }
  row1Toggle:    { role: button }
  row2:          { role: button }
  row3:          { role: button }
  row4:          { role: button }
  row1Subtasks:  { role: status }
  row1Attachments: { role: status }
  row2Title:     { role: generic }
  row3Title:     { role: generic }
  row3More:      { role: button }
  row4Title:     { role: generic }
  row5:          { role: button }
  row5Title:     { role: generic }
  row5Notes:     { role: generic }
  row6:          { role: button }
  row6Title:     { role: generic }
  row6More:      { role: button }
  row7Title:     { role: generic }
  row7Subtasks:  { role: status }
  row8Title:     { role: generic }
  subtaskTitle:  { role: textbox, same: [layout] }   # a text field
  # The row's menu: each platform may draw it as its own menu.
  menuCopy:      { role: button, same: [layout] }
  menuSubtask:   { role: button, same: [layout] }
  menuRename:    { role: button, same: [layout] }
  menuMove:      { role: button, same: [layout] }
  menuPromote:   { role: button, same: [layout] }
  menuDelete:    { role: button, same: [layout] }
  submenuItem2:  { role: button, same: [layout] }
  paneEmptyTitle:    { role: heading }
  paneEmptySubtitle: { role: generic }
  doneCount:     { role: status }
  donePercent:   { role: status }
  viewControl:   { role: button }
  selectedCount: { role: status }
  bulkDone:      { role: button }
  bulkUndone:    { role: button }
  bulkMove:      { role: button }
  bulkCopy:      { role: button }
  bulkDelete:    { role: button }
  bulkClear:     { role: button }

tests:
  - name: the launch plan shows its tasks in order, subtasks under their parents
    expect:
      - { part: search, text: "", name: "Search Launch plan" }
      - { part: row1Title, text: "Write the launch brief" }
      - { part: row1Notes, text: "Draft due Friday ; keep it to one page." }
      - { part: row1Subtasks, text: { matches: "^1 ?/ ?3$" } }
      - { part: row1Attachments, text: "2" }
      - { part: row2Title, text: "Collect the feature list" }
      - { part: row3Title, text: "Draft the summary" }
      - { part: row4Title, text: "Review with Sam" }
      - { part: row5Title, text: "Book the venue" }
      - { part: row5Notes, text: "Hall B, forty seats." }
      - { part: row6Title, text: "Order the banners" }
      - { part: row7Title, text: "Send the invitations" }
      - { part: row7Subtasks, text: { matches: "^1 ?/ ?1$" } }
      - { part: row8Title, text: "Confirm the guest list" }
      - { part: doneCount, text: "3/8 DONE" }
      - { part: donePercent, text: "38%" }
    screenshot: true

  - name: an empty list says so, and how to add a task
    props: { seed: empty, list: inbox }
    expect:
      - { part: paneEmptyTitle, text: "Nothing here yet" }
      - { part: paneEmptySubtitle, text: "Press + or ⌘N to add a task, or ⌘↩ anywhere to capture one" }
      - { part: doneCount, text: "0/0 DONE" }
      - { part: donePercent, text: "0%" }
    screenshot: true

  - name: pressing a row focuses its task
    steps:
      - { action: press, part: row5 }
    expect:
      - { event: taskFocused, times: 1, last: { id: venue } }
      - { event: taskCompleted, times: 0 }
    screenshot: true

  - name: the toggle-done input marks the focused task done, and the stats follow
    steps:
      - { action: press, part: row6 }
      - { input: toggleDone }
    expect:
      - { event: taskCompleted, times: 1, last: { id: banners, done: true } }
      - { part: doneCount, text: "4/8 DONE" }
      - { part: donePercent, text: "50%" }

  - name: the toggle-done input on a done task makes it active again
    steps:
      - { action: press, part: row5 }
      - { input: toggleDone }
    expect:
      - { event: taskCompleted, times: 1, last: { id: venue, done: false } }
      - { part: doneCount, text: "2/8 DONE" }

  - name: completing a task's last open subtask completes the task too
    steps:
      - { action: press, part: row3 }
      - { input: toggleDone }
      - { action: press, part: row4 }
      - { input: toggleDone }
    expect:
      # summary; then review, which leaves brief nothing open, so brief.
      - { event: taskCompleted, times: 3, last: { id: brief, done: true } }
      - { part: row1Subtasks, text: { matches: "^3 ?/ ?3$" } }
      - { part: doneCount, text: "6/8 DONE" }

  - name: reopening a done subtask counts it open again
    steps:
      - { action: press, part: row2 }
      - { input: toggleDone }
    expect:
      - { event: taskCompleted, times: 1, last: { id: features, done: false } }
      - { part: doneCount, text: "2/8 DONE" }

  # The design review (tauri/docs/main-app-design-review-2026-08-13.md, "Direction From Your
  # Answers") makes completion the round check's default meaning; the Tauri app still selects
  # with it, and completes only with ⌥ held. The ports follow the review.
  - name: pressing a row's round check marks the task done
    except: [tauri]
    steps:
      - { action: press, part: row1Check }
    expect:
      - { event: taskCompleted, times: 1, last: { id: brief, done: true } }
      - { part: doneCount, text: "4/8 DONE" }

  - name: collapsing a task hides its subtasks, and they count all the same
    steps:
      - { action: press, part: row1Toggle }
    expect:
      - { event: taskExpanded, times: 1, last: { id: brief, expanded: false } }
      - { part: row1Title, text: "Write the launch brief" }
      - { part: row2Title, text: "Book the venue" }
      - { part: row4Title, text: "Send the invitations" }
      - { part: doneCount, text: "3/8 DONE" }
    screenshot: true

  - name: with Show completed off, done tasks leave the list but still count
    props: { showCompleted: false }
    expect:
      - { part: row1Title, text: "Write the launch brief" }
      - { part: row1Subtasks, text: { matches: "^0 ?/ ?2$" } }
      - { part: row2Title, text: "Draft the summary" }
      - { part: row3Title, text: "Review with Sam" }
      - { part: row4Title, text: "Order the banners" }
      - { part: row5Title, text: "Send the invitations" }
      - { part: doneCount, text: "3/8 DONE" }

  - name: search narrows the tree to the matches, and counts them
    steps:
      - { action: type, part: search, text: "venue" }
    expect:
      - { part: row1Title, text: "Book the venue" }
      - { part: matchCount, text: "1" }
    screenshot: true

  - name: a search with no match says so
    steps:
      - { action: type, part: search, text: "zebra" }
    expect:
      - { part: matchCount, text: "0" }
      - { part: paneEmptyTitle, text: "No matches in Launch plan" }
      - { part: paneEmptySubtitle, text: "Try a different search or scope" }

  - name: clearing the search brings the whole list back
    steps:
      - { action: type, part: search, text: "venue" }
      - { action: press, part: clearSearch }
    expect:
      - { part: search, text: "" }
      - { part: row1Title, text: "Write the launch brief" }
      - { part: row8Title, text: "Confirm the guest list" }

  - name: a search for a subtask keeps its parent, so it shows where it lives
    steps:
      - { action: type, part: search, text: "guest" }
    expect:
      - { part: row1Title, text: "Send the invitations" }
      - { part: row2Title, text: "Confirm the guest list" }
      - { part: matchCount, text: "1" }

  - name: the plus opens a new draft for this list, and creates nothing yet
    steps:
      - { action: press, part: newTask }
    expect:
      - { event: draftOpened, times: 1, last: { listId: launch } }
      - { event: taskCreated, times: 0 }

  - name: the new-task input does the same
    steps:
      - { action: press, part: row6 }
      - { input: newTask }
    expect:
      - { event: draftOpened, times: 1, last: { listId: launch } }

  - name: a row's menu offers the task's actions
    steps:
      - { action: press, part: row6More }
    expect:
      - { part: menuCopy, text: "Copy" }
      - { part: menuSubtask, text: "Add subtask" }
      - { part: menuRename, text: "Rename" }
      - { part: menuMove, text: "Move to list" }
      - { part: menuDelete, text: "Delete task…" }
    screenshot: true

  - name: adding a subtask from the menu nests it under the task
    steps:
      - { action: press, part: row6More }
      - { action: press, part: menuSubtask }
      - { action: type, part: subtaskTitle, text: "Print the proofs" }
      - { action: key, part: subtaskTitle, key: Enter }
    expect:
      - { event: subtaskComposerOpened, times: 1, last: { parentId: banners } }
      - { event: taskCreated, times: 1, last: { title: "Print the proofs", listId: launch, parentId: banners } }
      - { part: row7Title, text: "Print the proofs" }
      - { part: doneCount, text: "3/9 DONE" }

  - name: deleting from the menu asks first, and trashes nothing yet
    steps:
      - { action: press, part: row6More }
      - { action: press, part: menuDelete }
    expect:
      - { event: confirmAsked, times: 1, last: { headline: "Move to Trash?" } }
      - { part: row6Title, text: "Order the banners" }

  - name: the delete input asks the same about the focused task
    steps:
      - { action: press, part: row6 }
      - { input: deleteTask }
    expect:
      - { event: confirmAsked, times: 1, last: { headline: "Move to Trash?" } }

  - name: moving a task to another list takes it out of this one
    steps:
      - { action: press, part: row6More }
      - { action: hover, part: menuMove }
      - { action: press, part: submenuItem2 }
    expect:
      - { event: taskMoved, times: 1, last: { id: banners, listId: groceries, parentId: "" } }
      - { part: row6Title, text: "Send the invitations" }
      - { part: doneCount, text: "3/7 DONE" }

  - name: a subtask can be promoted to the top level
    steps:
      - { action: press, part: row3More }
      - { action: press, part: menuPromote }
    expect:
      - { event: taskMoved, times: 1, last: { id: summary, listId: launch, parentId: "" } }
      - { part: row1Subtasks, text: { matches: "^1 ?/ ?2$" } }

  - name: copying a task puts it on the clipboard as a Markdown checklist
    steps:
      - { action: press, part: row6More }
      - { action: press, part: menuCopy }
    expect:
      - { event: copied, times: 1, last: { text: "- [ ] Order the banners" } }

  - name: the arrow keys walk the rows in order, subtasks included
    steps:
      - { action: press, part: row1 }
      - { action: key, part: row1, key: ArrowDown }
      - { action: key, part: row1, key: ArrowDown }
    expect:
      - { event: taskFocused, times: 3, last: { id: summary } }

  - name: the move-down input moves the focused task below its next sibling
    steps:
      - { action: press, part: row5 }
      - { input: moveDown }
    expect:
      - { event: taskMoved, times: 1, last: { id: venue, listId: launch, parentId: "" } }
      - { part: row5Title, text: "Order the banners" }
      - { part: row6Title, text: "Book the venue" }

  - name: with tasks selected the footer becomes the bulk bar
    props: { multi: "venue,banners" }
    expect:
      - { part: selectedCount, text: "2 SELECTED" }
      - { part: bulkDone, text: "Done" }
      - { part: bulkUndone, text: "Undone" }
      - { part: bulkMove, text: "Move to…" }
      - { part: bulkCopy, text: "Copy" }
      - { part: bulkDelete, text: "Delete" }
      - { part: bulkClear, text: "Clear" }
    screenshot: true

  - name: Done in the bulk bar marks every selected task done
    props: { multi: "venue,banners" }
    steps:
      - { action: press, part: bulkDone }
    expect:
      - { event: taskCompleted, times: 2, last: { id: banners, done: true } }
      - { part: selectedCount, text: "2 SELECTED" }

  - name: Clear in the bulk bar drops the selection and brings the stats back
    props: { multi: "venue,banners" }
    steps:
      - { action: press, part: bulkClear }
    expect:
      - { part: doneCount, text: "3/8 DONE" }
      - { event: taskCompleted, times: 0 }

  - name: Delete in the bulk bar asks first
    props: { multi: "venue,banners" }
    steps:
      - { action: press, part: bulkDelete }
    expect:
      - { event: confirmAsked, times: 1, last: { headline: "Move 2 tasks to Trash?" } }

  - name: the sort and filter control opens the filter panel
    steps:
      - { action: press, part: viewControl }
    expect:
      - { event: filterToggled, times: 1, last: { open: true } }

  - name: a long list scrolls, and its stats cover every task
    props: { seed: long, list: reading }
    expect:
      - { part: row1Title, text: "Read chapter 1" }
      - { part: doneCount, text: "7/30 DONE" }
      - { part: donePercent, text: "23%" }
    screenshot: true

viewports: [{ width: 860, height: 708 }]
colorSchemes: [light, dark]
# One product design, drawn idiomatically by each platform (DESIGN.md): every part keeps its
# layout, colours and motion, never its pixels; a part a platform draws as its own control
# (a text field, a menu) keeps only its layout.
same: [layout, colours, motion]
