id: ui.text
props:
  content: { type: string, default: "" }   # the text the widget shows
parts:
  text: { role: generic }   # the part that shows the text
tests:
  - name: shows the content
    props: { content: "Hello" }
    steps: [ { action: hover, part: text } ]
    expect: [ { part: text, text: "Hello" } ]
