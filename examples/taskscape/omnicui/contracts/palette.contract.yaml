# Contract app.palette: the web command palette (Ctrl/Cmd+K or the title-bar control, decision 7).
# Merged from two drafts with the critic's fixes applied.
# The harness mounts the palette open, so every test starts from the palette state.
#
# Reference states: palette (empty query), palette-search (query "new"), palette-no-match (query "zzzz").
# Web: the reference look is kept (web.md), including the soft scrim. A press outside the panel is not testable here (see notes).
# Not in this contract: the opener, the desktop separate window (no scrim, blur dismissal), and drag (no drag on this screen).
# drag: none on this screen, so no drag-and-drop tests.
# keyboard: not set. Rows are not focusable; the highlight is an index driven through the search input,
# so Enter, ArrowUp, ArrowDown, Tab and Escape are all pressed on the search part.
# Web hint glyphs are unresolved (see notes), so no test asserts a hint.
id: app.palette

props:
  # Data set loaded before mount, signed in as the demo account. Allowed: standard (default), empty, nolists, long.
  # No test varies it: the other data sets have no palette reference (see notes).
  dataset: { type: string, default: standard }
  # "" (default) = no task selected, so no Delete row is listed. Otherwise the exact title of a task in the
  # focused list (standard: "Buy groceries for the week", in Errands, the open list). The harness selects that task
  # the way a user does, then mounts the palette, so the Delete row is listed. A title not in the data set is a harness error.
  task: { type: string, default: "" }

events:
  # Harness-only event, not in the reference. The rebuild emits it on every command run (row click or Enter)
  # with the row's visible text, after the panel has closed. Escape emits nothing. See notes.
  ran:
    label: { type: string }

parts:
  # Command input (TextInput, bare), focused on open. Placeholder "Run a command or jump to…". Its text is its value.
  search: { role: textbox }
  # Dim layer behind the panel (web reference). aria: none. Only its visibility is checked; a press on it is not expressible.
  scrim: { role: generic }
  # Palette panel (Overlay root, 490 px wide, top at 91 px, max height 60vh, overflow hidden). aria: dialog.
  # Visible in every state; not visible = the palette has closed.
  panel: { role: generic }
  # Scrolling list holding group headings and rows. aria: listbox. Scrolls past the 60vh cap (456 px at 1180x760).
  results: { role: generic }
  # First command row (MenuItem, 32 px tall, one height for hotkey and no-hotkey rows). aria: option; drawn as a button.
  # Text includes its label and any key letter (hint modifiers are icons with no text node).
  row: { role: button }
  # Third row, "Swap panes", on screen without scrolling in the palette state. aria: option.
  rowSwapPanes: { role: button }
  # Last row in the palette state: jump row "Spring launch" (Go to project). Below the 60vh cap, so it scrolls into view. aria: option.
  rowSpringLaunch: { role: button }
  # "Delete “<task title>”" (Task group, no accelerator), listed only when a task is selected. aria: option.
  # Optional: absent from the default tests, so checks on it may be skipped there.
  rowDelete: { role: button, optional: true }
  # Group headings (Label as div, shown in capitals by CSS). aria: none. Shown only when a new group begins.
  # Match case-insensitively. The Go-to-list and Go-to-project headings are below the cap at open, so they are asserted only after scrolling.
  groupView: { role: generic }
  groupTask: { role: generic }
  groupManage: { role: generic }
  groupGoList: { role: generic }
  groupGoProject: { role: generic }
  # "No matching commands" (Label as p), shown only when no rows match. aria: none.
  emptyMessage: { role: generic }

tests:
  - name: opens with the input focused, the groups listed, and matches the palette reference
    steps: []
    expect:
      - { part: search, focused: true }
      - { part: scrim, visible: true }
      - { part: panel, visible: true }
      - { part: row, text: { contains: "Toggle preview" } }
      - { part: groupView, text: { matches: "(?i)^view$" } }
      - { part: groupTask, text: { matches: "(?i)^task$" } }
      - { part: groupManage, text: { matches: "(?i)^manage$" } }
      - { part: emptyMessage, visible: false }
    screenshot: true

  - name: typing new filters to three commands under two groups and matches the palette-search reference
    steps:
      - { action: type, part: search, text: "new" }
    expect:
      - { part: search, text: "new" }
      - { part: groupView, visible: false }
      - { part: groupGoList, visible: false }
      - { part: groupGoProject, visible: false }
      - { part: groupTask, text: { matches: "(?i)^task$" } }
      - { part: groupManage, text: { matches: "(?i)^manage$" } }
      - { part: row, text: { contains: "New task" } }
      - { part: results, text: { contains: "New project" } }
      - { part: emptyMessage, visible: false }
    screenshot: true

  - name: typing a query resets the highlight to the first row
    steps:
      - { action: key, part: search, key: ArrowDown }
      - { action: key, part: search, key: ArrowDown }
      - { action: type, part: search, text: "new" }
      - { action: key, part: search, key: Enter }
    expect:
      - { event: ran, times: 1, last: { label: "New task" } }
      - { part: panel, visible: false }

  - name: a query with no match shows the empty message and no rows, and matches the palette-no-match reference
    steps:
      - { action: type, part: search, text: "zzzz" }
    expect:
      - { part: search, text: "zzzz" }
      - { part: emptyMessage, text: "No matching commands" }
      - { part: row, visible: false }
      - { part: groupView, visible: false }
    screenshot: true

  - name: ArrowDown and Enter do nothing when nothing matches
    steps:
      - { action: type, part: search, text: "zzzz" }
      - { action: key, part: search, key: ArrowDown }
      - { action: key, part: search, key: ArrowDown }
      - { action: key, part: search, key: Enter }
    expect:
      - { event: ran, times: 0 }
      - { part: panel, visible: true }
      - { part: search, text: "zzzz" }
      - { part: emptyMessage, text: "No matching commands" }
      - { part: row, visible: false }

  - name: a query typed in capitals runs its matching row
    steps:
      - { action: type, part: search, text: "PREVIEW" }
      - { action: key, part: search, key: Enter }
    expect:
      - { event: ran, times: 1, last: { label: "Toggle preview" } }
      - { part: panel, visible: false }

  - name: Enter runs the highlighted row, which starts on the first row
    steps:
      - { action: key, part: search, key: Enter }
    expect:
      - { event: ran, times: 1, last: { label: "Toggle preview" } }
      - { part: panel, visible: false }

  - name: clicking a row runs it and closes the palette
    steps:
      - { action: press, part: row }
    expect:
      - { event: ran, times: 1, last: { label: "Toggle preview" } }
      - { part: panel, visible: false }

  - name: ArrowDown moves the highlight down one row
    steps:
      - { action: key, part: search, key: ArrowDown }
      - { action: key, part: search, key: Enter }
    expect:
      - { event: ran, times: 1, last: { label: "Toggle split view" } }
      - { part: panel, visible: false }

  - name: ArrowUp moves the highlight back up
    steps:
      - { action: key, part: search, key: ArrowDown }
      - { action: key, part: search, key: ArrowDown }
      - { action: key, part: search, key: ArrowUp }
      - { action: key, part: search, key: Enter }
    expect:
      - { event: ran, times: 1, last: { label: "Toggle split view" } }
      - { part: panel, visible: false }

  - name: ArrowUp stops at the first row
    steps:
      - { action: key, part: search, key: ArrowDown }
      - { action: key, part: search, key: ArrowDown }
      - { action: key, part: search, key: ArrowDown }
      - { action: key, part: search, key: ArrowUp }
      - { action: key, part: search, key: ArrowUp }
      - { action: key, part: search, key: ArrowUp }
      - { action: key, part: search, key: ArrowUp }
      - { action: key, part: search, key: ArrowUp }
      - { action: key, part: search, key: Enter }
    expect:
      - { event: ran, times: 1, last: { label: "Toggle preview" } }
      - { part: panel, visible: false }

  - name: hovering a row moves the highlight onto it
    steps:
      - { action: hover, part: rowSwapPanes }
      - { action: key, part: search, key: Enter }
    expect:
      - { event: ran, times: 1, last: { label: "Swap panes" } }
      - { part: panel, visible: false }

  - name: ArrowDown moves the highlight to the last row and stops there
    steps:
      - { action: key, part: search, key: ArrowDown }
      - { action: key, part: search, key: ArrowDown }
      - { action: key, part: search, key: ArrowDown }
      - { action: key, part: search, key: ArrowDown }
      - { action: key, part: search, key: ArrowDown }
      - { action: key, part: search, key: ArrowDown }
      - { action: key, part: search, key: ArrowDown }
      - { action: key, part: search, key: ArrowDown }
      - { action: key, part: search, key: ArrowDown }
      - { action: key, part: search, key: ArrowDown }
      - { action: key, part: search, key: ArrowDown }
      - { action: key, part: search, key: ArrowDown }
      - { action: key, part: search, key: ArrowDown }
      - { action: key, part: search, key: ArrowDown }
      - { action: key, part: search, key: ArrowDown }
      - { action: key, part: search, key: ArrowDown }
      - { action: key, part: search, key: ArrowDown }
      - { action: key, part: search, key: ArrowDown }
      - { action: key, part: search, key: ArrowDown }
      - { action: key, part: search, key: Enter }
    expect:
      - { event: ran, times: 1, last: { label: "Spring launch" } }
      - { part: panel, visible: false }

  - name: the last row scrolls into view after moving down the list
    steps:
      - { action: key, part: search, key: ArrowDown }
      - { action: key, part: search, key: ArrowDown }
      - { action: key, part: search, key: ArrowDown }
      - { action: key, part: search, key: ArrowDown }
      - { action: key, part: search, key: ArrowDown }
      - { action: key, part: search, key: ArrowDown }
      - { action: key, part: search, key: ArrowDown }
      - { action: key, part: search, key: ArrowDown }
      - { action: key, part: search, key: ArrowDown }
      - { action: key, part: search, key: ArrowDown }
      - { action: key, part: search, key: ArrowDown }
      - { action: key, part: search, key: ArrowDown }
      - { action: key, part: search, key: ArrowDown }
      - { action: key, part: search, key: ArrowDown }
      - { action: key, part: search, key: ArrowDown }
      - { action: key, part: search, key: ArrowDown }
      - { action: key, part: search, key: ArrowDown }
      - { action: key, part: search, key: ArrowDown }
    expect:
      - { part: rowSpringLaunch, visible: true }
      - { part: groupGoProject, text: { matches: "(?i)^go to project$" } }
      - { part: panel, visible: true }

  - name: Escape closes the palette without running a command
    steps:
      - { action: key, part: search, key: Escape }
    expect:
      - { event: ran, times: 0 }
      - { part: panel, visible: false }

  - name: Escape closes the palette from a filtered list without running a command
    steps:
      - { action: type, part: search, text: "new" }
      - { action: key, part: search, key: Escape }
    expect:
      - { event: ran, times: 0 }
      - { part: panel, visible: false }

  - name: clearing the query restores every command and matches the groups at open
    steps:
      - { action: type, part: search, text: "new" }
      - { action: key, part: search, key: Backspace }
      - { action: key, part: search, key: Backspace }
      - { action: key, part: search, key: Backspace }
    expect:
      - { part: search, text: "" }
      - { part: row, text: { contains: "Toggle preview" } }
      - { part: groupView, text: { matches: "(?i)^view$" } }
      - { part: groupManage, text: { matches: "(?i)^manage$" } }
    screenshot: true

  - name: New task row runs from its label
    steps:
      - { action: type, part: search, text: "new task" }
      - { action: key, part: search, key: Enter }
    expect:
      - { event: ran, times: 1, last: { label: "New task" } }
      - { part: panel, visible: false }

  - name: Show / hide completed row runs its command
    steps:
      - { action: type, part: search, text: "completed" }
      - { action: key, part: search, key: Enter }
    expect:
      - { event: ran, times: 1, last: { label: "Show / hide completed" } }
      - { part: panel, visible: false }

  - name: Collapse all row runs its command
    steps:
      - { action: type, part: search, text: "collapse" }
      - { action: key, part: search, key: Enter }
    expect:
      - { event: ran, times: 1, last: { label: "Collapse all" } }
      - { part: panel, visible: false }

  - name: Expand all row runs its command
    steps:
      - { action: type, part: search, text: "expand" }
      - { action: key, part: search, key: Enter }
    expect:
      - { event: ran, times: 1, last: { label: "Expand all" } }
      - { part: panel, visible: false }

  - name: Search this list row runs its command
    steps:
      - { action: type, part: search, text: "search this" }
      - { action: key, part: search, key: Enter }
    expect:
      - { event: ran, times: 1, last: { label: "Search this list" } }
      - { part: panel, visible: false }

  - name: Undo row runs its command
    steps:
      - { action: type, part: search, text: "undo" }
      - { action: key, part: search, key: Enter }
    expect:
      - { event: ran, times: 1, last: { label: "Undo" } }
      - { part: panel, visible: false }

  - name: Redo row runs its command
    steps:
      - { action: type, part: search, text: "redo" }
      - { action: key, part: search, key: Enter }
    expect:
      - { event: ran, times: 1, last: { label: "Redo" } }
      - { part: panel, visible: false }

  - name: New list row runs its command
    steps:
      - { action: type, part: search, text: "new list" }
      - { action: key, part: search, key: Enter }
    expect:
      - { event: ran, times: 1, last: { label: "New list" } }
      - { part: panel, visible: false }

  - name: New project row runs its command
    steps:
      - { action: type, part: search, text: "new project" }
      - { action: key, part: search, key: Enter }
    expect:
      - { event: ran, times: 1, last: { label: "New project" } }
      - { part: panel, visible: false }

  - name: Open Trash runs from its label
    steps:
      - { action: type, part: search, text: "Open Trash" }
      - { action: key, part: search, key: Enter }
    expect:
      - { event: ran, times: 1, last: { label: "Open Trash" } }
      - { part: panel, visible: false }

  - name: Settings row runs its command
    steps:
      - { action: type, part: search, text: "settings" }
      - { action: key, part: search, key: Enter }
    expect:
      - { event: ran, times: 1, last: { label: "Settings" } }
      - { part: panel, visible: false }

  - name: a go-to-list jump row runs from its label
    steps:
      - { action: type, part: search, text: "reading" }
      - { action: key, part: search, key: Enter }
    expect:
      - { event: ran, times: 1, last: { label: "Reading" } }
      - { part: panel, visible: false }

  - name: Errands jump row runs from its label
    steps:
      - { action: type, part: search, text: "Errands" }
      - { action: key, part: search, key: Enter }
    expect:
      - { event: ran, times: 1, last: { label: "Errands" } }
      - { part: panel, visible: false }

  - name: the Home go-to-project row runs from its label
    steps:
      - { action: type, part: search, text: "home" }
      - { action: key, part: search, key: Enter }
    expect:
      - { event: ran, times: 1, last: { label: "Home" } }
      - { part: panel, visible: false }

  - name: Spring launch jump row runs from its label
    steps:
      - { action: type, part: search, text: "Spring launch" }
      - { action: key, part: search, key: Enter }
    expect:
      - { event: ran, times: 1, last: { label: "Spring launch" } }
      - { part: panel, visible: false }

  - name: Delete row appears for the selected task
    props: { task: "Buy groceries for the week" }
    steps:
      - { action: type, part: search, text: "delete" }
    expect:
      - { part: rowDelete, text: { contains: "Delete “Buy groceries for the week”" } }

  - name: Delete row runs for the selected task and closes the palette
    props: { task: "Buy groceries for the week" }
    steps:
      - { action: type, part: search, text: "delete" }
      - { action: key, part: search, key: Enter }
    expect:
      - { event: ran, times: 1, last: { label: "Delete “Buy groceries for the week”" } }
      - { part: panel, visible: false }

  - name: Delete row is absent when no task is selected
    steps:
      - { action: type, part: search, text: "delete" }
    expect:
      - { part: emptyMessage, text: "No matching commands" }
      - { part: rowDelete, visible: false }

  - name: Tab and Shift+Tab keep focus in the palette
    steps:
      - { action: key, part: search, key: Tab }
      - { action: key, part: search, key: Tab }
      - { action: key, part: search, key: Tab }
      - { action: key, part: search, key: "Shift+Tab" }
    expect:
      - { part: search, focused: true }
      - { part: panel, visible: true }

  - name: a press inside the panel does not dismiss it
    steps:
      - { action: press, part: search }
    expect:
      - { part: panel, visible: true }

viewports:
  - { width: 1180, height: 760 }

colorSchemes: [ light ]
