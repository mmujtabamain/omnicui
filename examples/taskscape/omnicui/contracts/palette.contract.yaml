# yaml-language-server: $schema=../../../../tools/omnicui/schema/contract.schema.json
# The command palette (SPEC-PRODUCT.md, "taskscape.palette"): ⌘K's launcher over the window. Any
# command, list or project by name; Enter runs the highlighted one. Its own component, since it
# is an overlay the window opens, not a part of it.
#
# Commands are parts by position, in the order shown: with nothing typed and no task focused,
#   View: 1 Toggle preview, 2 Toggle split view, 3 Swap panes, 4 Show / hide completed,
#         5 Collapse all, 6 Expand all
#   Task: 7 New task, 8 Search this list, 9 Undo, 10 Redo
#   Manage: 11 New list, 12 New project, 13 Open Trash, 14 Settings
#   Go to list: 15 Launch plan, 16 Groceries, 17 Inbox;  Go to project: 18 Atlas, 19 Home
id: taskscape.palette

props:
  seed:     { type: string, enum: [standard], default: standard }
  # The focused task, by key: the palette then offers to delete it.
  selected: { type: string, default: "" }

events:
  # The command run, by id: `toggle_preview`, `go-list-groceries` (a list's key), …
  commandRun:     { command: { type: string } }
  closed:         {}
  paneShows:      { listId: { type: string } }
  previewToggled: { open: { type: boolean } }
  confirmAsked:   { headline: { type: string } }

parts:
  paletteInput:  { role: textbox, same: [layout] }   # a text field
  paletteEmpty:  { role: status }
  commandGroup1: { role: heading }
  command1:      { role: button }
  command2:      { role: button }
  command3:      { role: button }

tests:
  - name: the palette opens empty and focused, with every command under its group
    expect:
      - { part: paletteInput, text: "", focused: true, name: "Run a command or jump to…" }
      - { part: commandGroup1, text: "VIEW" }
      - { part: command1, text: { contains: "Toggle preview" } }
      - { part: command2, text: { contains: "Toggle split view" } }
      - { part: command3, text: "Swap panes" }
    screenshot: true

  - name: typing narrows the commands to the ones that match, earliest match first
    steps:
      - { action: type, part: paletteInput, text: "groc" }
    expect:
      - { part: commandGroup1, text: "GO TO LIST" }
      - { part: command1, text: "Groceries" }
    screenshot: true

  - name: a project is found by its name, and Enter goes to it
    steps:
      - { action: type, part: paletteInput, text: "home" }
      - { action: key, part: paletteInput, key: Enter }
    expect:
      - { event: commandRun, times: 1, last: { command: go-proj-home } }

  - name: nothing matching says so
    steps:
      - { action: type, part: paletteInput, text: "zebra" }
    expect:
      - { part: paletteEmpty, text: "No matching commands" }

  - name: Enter runs the highlighted command and closes the palette
    steps:
      - { action: type, part: paletteInput, text: "groc" }
      - { action: key, part: paletteInput, key: Enter }
    expect:
      - { event: commandRun, times: 1, last: { command: go-list-groceries } }
      - { event: closed, times: 1 }
      - { event: paneShows, times: 1, last: { listId: groceries } }

  - name: the arrows move the highlight before Enter
    steps:
      - { action: key, part: paletteInput, key: ArrowDown }
      - { action: key, part: paletteInput, key: ArrowDown }
      - { action: key, part: paletteInput, key: Enter }
    expect:
      - { event: commandRun, times: 1, last: { command: swap_panes } }

  - name: pressing a command runs it
    steps:
      - { action: press, part: command1 }
    expect:
      - { event: commandRun, times: 1, last: { command: toggle_preview } }
      - { event: previewToggled, times: 1, last: { open: false } }
      - { event: closed, times: 1 }

  - name: Escape closes the palette and runs nothing
    steps:
      - { action: key, part: paletteInput, key: Escape }
    expect:
      - { event: closed, times: 1 }
      - { event: commandRun, times: 0 }

  - name: with a task focused, the palette offers to delete it
    props: { selected: venue }
    steps:
      - { action: type, part: paletteInput, text: "delete" }
      - { action: key, part: paletteInput, key: Enter }
    expect:
      - { event: commandRun, times: 1, last: { command: delete_sel } }
      - { event: confirmAsked, times: 1, last: { headline: "Move to Trash?" } }

viewports: [{ width: 1180, height: 760 }]
colorSchemes: [light, dark]
same: [layout, colours, motion]
keyboard: true
