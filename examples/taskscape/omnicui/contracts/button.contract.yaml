  - name: tooltip opens on hover
    props: { description: "Copy a file into this task", label: File }
    steps: [ { action: hover, part: button } ]
    expect:
      - { part: tooltip, visible: true, text: "Copy a file into this task" }
      - { part: button, name: File }

  - name: tooltip opens on keyboard focus and keeps the ariaLabel as the name
    props: { shape: icon, icon: content_copy, ariaLabel: "Copy a file", description: "Copy a file into this task" }
    steps: [ { action: focus, part: button } ]
    expect:
      - { part: tooltip, visible: true, text: { contains: "Copy a file into this task" } }
      - { part: button, name: "Copy a file" }

  - name: tooltip opens on hover and keeps the ariaLabel as the name
    props: { shape: icon, icon: content_copy, ariaLabel: "Copy a file", description: "Copy a file into this task" }
    steps: [ { action: hover, part: button } ]
    expect:
      - { part: tooltip, visible: true, text: { contains: "Copy a file into this task" } }
      - { part: button, name: "Copy a file" }

  - name: Escape closes the tooltip without activating
    props: { description: "Copy a file into this task", label: File }
    steps:
      - { action: focus, part: button }
      - { action: key, part: button, key: Escape }
    expect:
      - { part: tooltip, visible: false }
      - { event: activated, times: 0 }

  - name: Escape closes an open tooltip with an icon button and does not activate
    props: { shape: icon, icon: content_copy, ariaLabel: "Copy a file", description: "Copy a file into this task" }
    steps:
      - { action: focus, part: button }
      - { action: key, part: button, key: Escape }
    expect:
      - { part: tooltip, visible: false }
      - { event: activated, times: 0 }

  - name: shortcut shows the Command glyph on macOS
    only: [macos]
    props: { shape: icon, icon: save, ariaLabel: Save, description: Save, shortcut: "Mod+S" }
    steps: [ { action: focus, part: button } ]
    expect: [ { part: tooltip, visible: true, text: { matches: '⌘S' } } ]

  - name: shortcut shows Control elsewhere
    except: [macos]
    props: { shape: icon, icon: save, ariaLabel: Save, description: Save, shortcut: "Mod+S" }
    steps: [ { action: focus, part: button } ]
    expect: [ { part: tooltip, visible: true, text: { matches: 'Ctrl\+S' } } ]

  - name: shortcut shown in tooltip on hover
    props: { shortcut: "Mod+K", description: "Search and commands", label: Search }
    steps: [ { action: hover, part: button } ]
    expect: [ { part: tooltip, text: { matches: '(⌘|Ctrl\+)K' } } ]

  # Icons and web only
  - name: asChild on web makes the child the button and it navigates with role link
    only: [web]
    props: { asChild: true, label: "Open", icon: open_in_new }
    steps: [ { action: press, part: child } ]
    expect:
      - { event: activated, times: 1, last: { count: 1 } }
      - { part: child, role: button }

  - name: asChild on desktop is ignored
    only: [desktop]
    props: { asChild: true, label: "Open" }
    steps: [ { action: press, part: button } ]
    expect:
      - { part: button, name: "Open" }
      - { event: activated, times: 1, last: { count: 1 } }

viewports: [ { width: 320, height: 240 } ]
colorSchemes: [ light, dark ]
keyboard: true
mask: [ tooltip ]

# open (decisions and items this contract cannot check; the format has no open field, so they live here)
#
# Decisions taken in this merge:
# - width default is full (spec). content is kept as an added value for label-width toolbar buttons, tested.
# - neutral tone is an alias of default. neutral variant is a separate filled button.
# - error prop is named errorText; dashed heights are named dashedShort (35px) and dashedTall (84px).
# - shape=icon is the icon-only form (the spec purpose says size=icon; the axis says shape). Chosen: shape=icon.
# - focusable is merged into tabbable (duplicate). Draft B focusable test merged into the Tab order test.
# - fullWidth maps to width full. onClick maps to the activated event. pressed, pressedIcon, haspopup and
#   expanded are not props: aria-pressed belongs to Toggle, aria-haspopup to MenuButton, aria-expanded to DisclosureButton.
# - children maps to label, or to the child part on web with asChild.
# - active is exposed as the selected field (a chosen button), not aria-pressed. A rich-text link mark that
#   needs aria-pressed should use Toggle instead. Team to confirm.
# - layout is added (inline | stacked) for the TileButton form. Team confirmation pending.
# - empty-label rule: label is required when shape is text, unless emptyLabel is set. emptyLabel shows when label is "".
# - feedback: caller owns the 1200 ms timer. The feedback status part announces feedbackLabel.
# - busy and disabled use the native disabled state (focus removed). The APG suggests aria-disabled so the
#   control stays discoverable. Team to decide; the native choice is tested by "disabled cannot take focus".
#
# Not checkable in this contract (untestable here):
# - keepFocusOnPress and retainFocus need a textbox part. A composed test belongs in the sheet or draft title
#   contract (press the button, expect the textbox to keep focus and its caret). Not written here.
# - type submit: a form part is not in this format. A composed form test would expect no submit with the default type.
# - pressed-down (active-down) state: the press action completes a press, so the mid-press state cannot be read.
# - the 1200 ms feedback revert: the caller's timer; check it in the caller's contract.
# - the tooltip role (aria: tooltip) and the aria-describedby link for description and errorText:
#   the tooltip part is generic in this format.
# - reveal row selected state (the row is selected and the button is revealed): needs a row part. Move the test
#   to the list or row contract that owns the row.
# - hidden reveal buttons (opacity 0) remain in the accessibility tree and the Tab order until the row gains focus.
#   Screenshot tests do not measure this.
# - tabbable false on Clear draft and Attach screenshot removes them from the Tab order. The spec says the
#   shortcuts then become the only keyboard route. The shortcut-activates-action test belongs in the capture-bar contract.
# - size sm (21px) and footer (25 by 19) are below the 24px minimum target size (WCAG 2.5.8). No hit-area check
#   exists in this format. Record the exception here; spacing must cover it in the layout.
# - the Enter input and Escape input names (confirm, dismiss) are not verified in platforms.yaml; key actions are used instead.
# - the web role for navigating actions: asChild renders an anchor (role link on web, tested above). Desktop
#   buttons remain role button.
