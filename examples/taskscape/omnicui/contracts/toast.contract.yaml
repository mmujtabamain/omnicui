# yaml-language-server: $schema=../../../../tools/omnicui/schema/contract.schema.json
# The toast (SPEC-PRODUCT.md, "taskscape.toast"): the one transient message at the bottom of the
# window, after something undoable happened; it offers Undo. Mounted after the delete that shows
# it in the app (commands/tasks.ts): the task is in the Trash, and the toast says so.
id: taskscape.toast

props:
  seed:    { type: string, enum: [standard], default: standard }
  # The task just moved to the Trash, by key.
  trashed: { type: string, default: banners }

events:
  taskRestored: { id: { type: string } }

parts:
  toastMessage: { role: status }
  toastAction:  { role: button }
  toastDismiss: { role: button }

tests:
  - name: after a delete the toast says where the task went and offers Undo
    expect:
      - { part: toastMessage, text: "Moved to Trash" }
      - { part: toastAction, text: "Undo" }
      - { part: toastDismiss, name: "Dismiss" }
    screenshot: true

  - name: Undo brings the task back
    steps:
      - { action: press, part: toastAction }
    expect:
      - { event: taskRestored, times: 1, last: { id: banners } }

  - name: dismissing the toast leaves the task in the Trash
    steps:
      - { action: press, part: toastDismiss }
    expect:
      - { event: taskRestored, times: 0 }

viewports: [{ width: 1180, height: 160 }]
colorSchemes: [light, dark]
same: [layout, colours, motion]
keyboard: true
