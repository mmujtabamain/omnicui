# yaml-language-server: $schema=../../../../tools/omnicui/schema/contract.schema.json
# A sheet (SPEC-PRODUCT.md, "taskscape.sheet"): how the app asks a question. One panel centred
# over the dimmed window, answered with Enter (the accept verb) or Escape; a prompt has a
# field. Every flow that asks opens one: it is mounted here by the flow that opens it (`kind`).
id: taskscape.sheet

props:
  seed: { type: string, enum: [standard], default: standard }
  kind: { type: string, enum: [newList, renameList, deleteList, deleteTask, newProject, renameProject, deleteProject], default: deleteTask }
  # The list, task or project the question is about, by key.
  list:    { type: string, default: launch }
  task:    { type: string, default: brief }
  project: { type: string, default: atlas }

events:
  # How the sheet was answered: accept (with the field's trimmed text), instead, or dismiss.
  answered:       { action: { type: string, enum: [accept, instead, dismiss] }, text: { type: string } }
  taskTrashed:    { id: { type: string } }
  listCreated:    { id: { type: string }, name: { type: string }, projectId: { type: string } }
  listRenamed:    { id: { type: string }, name: { type: string } }
  listDeleted:    { id: { type: string } }
  projectCreated: { id: { type: string }, name: { type: string } }
  projectRenamed: { id: { type: string }, name: { type: string } }
  projectDeleted: { id: { type: string } }

parts:
  sheetHeadline: { role: heading }
  sheetDetail:   { role: generic }
  sheetField:    { role: textbox, same: [layout] }   # a text field
  sheetDice:     { role: button }
  sheetAccept:   { role: button }
  sheetCancel:   { role: button }
  sheetInstead:  { role: button }

tests:
  - name: deleting a task asks to move it, and its subtasks, to the Trash
    expect:
      - { part: sheetHeadline, text: "Move to Trash?" }
      - { part: sheetDetail, text: "“Write the launch brief” and its 3 subtasks — ⌘Z puts it back." }
      - { part: sheetAccept, text: { contains: "Move" } }
      - { part: sheetCancel, text: { contains: "Cancel" } }
      - { event: taskTrashed, times: 0 }
    screenshot: true

  - name: accepting moves the task to the Trash
    steps:
      - { action: press, part: sheetAccept }
    expect:
      - { event: answered, times: 1, last: { action: accept, text: "" } }
      - { event: taskTrashed, times: 1, last: { id: brief } }

  - name: Enter accepts too
    steps:
      - { input: confirm }
    expect:
      - { event: answered, times: 1, last: { action: accept } }
      - { event: taskTrashed, times: 1, last: { id: brief } }

  - name: Cancel dismisses and trashes nothing
    steps:
      - { action: press, part: sheetCancel }
    expect:
      - { event: answered, times: 1, last: { action: dismiss } }
      - { event: taskTrashed, times: 0 }

  - name: Escape dismisses too
    steps:
      - { input: dismiss }
    expect:
      - { event: answered, times: 1, last: { action: dismiss } }
      - { event: taskTrashed, times: 0 }

  - name: deleting a list says what goes with it, in the danger tone
    props: { kind: deleteList }
    expect:
      - { part: sheetHeadline, text: "Delete “Launch plan”?" }
      - { part: sheetDetail, text: "Its 8 tasks go with it. No undo." }
      - { part: sheetAccept, text: { contains: "Delete list" } }
    screenshot: true

  - name: accepting deletes the list
    props: { kind: deleteList }
    steps:
      - { action: press, part: sheetAccept }
    expect:
      - { event: listDeleted, times: 1, last: { id: launch } }

  - name: a new list is named in the sheet, and Import JSON is the other way in
    props: { kind: newList }
    expect:
      - { part: sheetHeadline, text: "New list" }
      - { part: sheetField, focused: true, name: "New list" }
      - { part: sheetAccept, text: { contains: "Create" }, disabled: false }
      - { part: sheetInstead, text: { contains: "Import JSON…" } }
      - { part: sheetDice, name: "Roll another name" }
    # The field holds a random name from the dice.
    screenshot: { mask: [sheetField] }

  - name: the typed name replaces the suggested one, and Create makes the list
    props: { kind: newList }
    steps:
      - { action: type, part: sheetField, text: "Errands" }
      - { action: press, part: sheetAccept }
    expect:
      - { event: answered, times: 1, last: { action: accept, text: "Errands" } }
      - { event: listCreated, times: 1, last: { name: "Errands", projectId: atlas } }

  - name: an empty name can't be accepted
    props: { kind: newList }
    steps:
      - { action: type, part: sheetField, text: "x" }
      - { action: key, part: sheetField, key: Backspace }
    expect:
      - { part: sheetField, text: "" }
      - { part: sheetAccept, disabled: true }

  - name: Import JSON answers the other way
    props: { kind: newList }
    steps:
      - { action: press, part: sheetInstead }
    expect:
      - { event: answered, times: 1, last: { action: instead } }
      - { event: listCreated, times: 0 }

  - name: renaming a list starts from its name
    props: { kind: renameList }
    steps:
      - { action: type, part: sheetField, text: "Launch week" }
      - { action: key, part: sheetField, key: Enter }
    expect:
      - { event: listRenamed, times: 1, last: { id: launch, name: "Launch week" } }

  - name: renaming a list shows its current name, selected
    props: { kind: renameList }
    expect:
      - { part: sheetHeadline, text: "Rename list" }
      - { part: sheetField, text: "Launch plan", focused: true }
      - { part: sheetAccept, text: { contains: "Rename" } }

  - name: a new project is named in the sheet
    props: { kind: newProject }
    steps:
      - { action: type, part: sheetField, text: "Garden" }
      - { action: key, part: sheetField, key: Enter }
    expect:
      - { event: projectCreated, times: 1, last: { name: "Garden" } }

  - name: renaming a project
    props: { kind: renameProject, project: home }
    steps:
      - { action: type, part: sheetField, text: "House" }
      - { action: key, part: sheetField, key: Enter }
    expect:
      - { event: projectRenamed, times: 1, last: { id: home, name: "House" } }

  - name: deleting a project says what goes with it
    props: { kind: deleteProject, project: home }
    steps:
      - { action: press, part: sheetAccept }
    expect:
      - { event: projectDeleted, times: 1, last: { id: home } }

viewports: [{ width: 1180, height: 760 }]
colorSchemes: [light, dark]
same: [layout, colours, motion]
