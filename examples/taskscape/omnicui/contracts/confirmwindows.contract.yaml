# Contract for app.confirmwindows (desktop only). Each confirmation and prompt sheet is its own OS window over its parent window.
# No scrim, no backdrop, no press-outside dismissal (notes-sheets [desktop]). The web dialogs are app.sheets.
# Decisions 2, 8, 10, 12, 13 and 21 apply. The OS draws every window control, so close, minimise and zoom are never tested.
id: "app.confirmwindows"

props:
  # dataset: the demo data the parent main window is seeded with before the window opens.
  # Allowed: standard | empty | nolists | long (web.md). Default standard.
  dataset: { type: string, default: standard }
  # open: the one window the harness opens over its parent window. The parent is mounted, so the changed event can be read.
  # Allowed (camelCase): newList | newProject | renameList | renameProject | deleteList | deleteProject | moveToTrash | emptyTrash | deletePermanently.
  # Targets when target is "": renameList and deleteList use list Reading (standard) or Inbox (empty);
  # renameProject and deleteProject use the active project Home; moveToTrash uses task "Book bike service" in Errands;
  # emptyTrash and deletePermanently use the Trash rows of standard. deletePermanently selects the two Trash rows
  # "Print the old flyer" and "Call the printer about samples" (names from one draft, not re-checked against the data).
  open: { type: string, default: newList }
  # count: moveToTrash and deletePermanently only. How many items the window is about. 1 is the single-task copy.
  # deletePermanently is opened only for 2 or more; the harness rejects a lower count (decision 12: one row is purged at once, no window).
  # moveToTrash with count 3 selects the first three open tasks of Errands, starting with "Book bike service".
  count: { type: integer, default: 1 }
  # target: the exact name of the list, project or task the window acts on. "" uses the reference target above.
  # Used by renameList, deleteList, renameProject, deleteProject and moveToTrash only.
  target: { type: string, default: "" }
  # initialName: newList and newProject only. The text the name field starts with, selected. The harness sets it before the window shows.
  # "" leaves the app's own rolled name in place. Not used by renameList or renameProject (their field starts with the current name).
  # This is the only starting-text seam in this contract. If the app has no such seam, the parent must add one.
  initialName: { type: string, default: "" }

events:
  # answered: how the window resolved. action: accept | dismiss | instead (instead is only checked for visibility, see notes).
  # text: the trimmed name for prompts, "" for confirmations and dismiss. id: the spec's instead id on instead, "" otherwise (not asserted here).
  answered: { action: { type: string }, text: { type: string }, id: { type: string } }
  # changed: the data change an accept made in the parent's data, observed through the mounted parent.
  # kind: list-created | project-created | list-renamed | project-renamed | list-deleted | project-deleted | task-trashed | trash-emptied | purged.
  # name: the list, project or task name. Exceptions with no single name: "Trash" for trash-emptied and "2 items" for purged (named by this contract, not by the sources).
  changed: { kind: { type: string }, name: { type: string } }

parts:
  badge: { role: generic }                      # aria: none (decorative glyph badge, aria-hidden). Tone danger on confirmations, accent on prompts. Checked by screenshot only.
  card: { role: generic }                       # aria: dialog (the window's card, named by the headline). Role dialog is outside the role set, mapped to generic.
  headline: { role: heading }                   # aria: h2 (the dialog's accessible name)
  detail: { role: generic }                     # aria: p. Required on deleteList, deleteProject and moveToTrash; expected on emptyTrash and deletePermanently (copy not confirmed). Prompts have no detail and no test reads it.
  field: { role: textbox, optional: true }      # the name input; absent on the confirmations
  roll: { role: button, optional: true }        # IconButton "Roll another name"; newList, newProject, renameList. Not in the tab order.
  instead: { role: button, optional: true }     # KeyAction "Import JSON…"; newList only
  footer: { role: generic }                     # the action row under a 1px divider
  cancel: { role: button }                      # KeyAction "Cancel"; focused on open for every confirmation
  accept: { role: button }                      # the accept verb, named per window

viewports:
  # Not a run list. The harness sizes each window from its open value. Prompts (newList, newProject, renameList, renameProject): 364 x 141.
  # Confirmations (deleteList, deleteProject, moveToTrash, emptyTrash, deletePermanently): 364 x 122. Only deleteList and the prompts are measured in the inventory.
  - { width: 364, height: 141 }
  - { width: 364, height: 122 }

# Only light is recorded. Dark appearance was not recorded (F09-092).
colorSchemes: [light]

# Off on purpose: keyboard true would make Enter press every button, which decision 10 forbids on the danger buttons.
# Enter and Space are tested per button below.
keyboard: false

tests:
  # --- New list (prompt) ---
  - name: "New list opens focused on its name with Create enabled"
    only: [desktop]
    props: { dataset: standard, open: newList, initialName: "Golden Oasis" }
    steps: []   # the window opens at mount; no step starts it
    expect:
      - { part: field, focused: true }
      - { part: field, name: "New list" }
      - { part: field, text: "Golden Oasis" }
      - { part: headline, text: "New list" }
      - { part: footer, visible: true }
      - { part: instead, name: "Import JSON…" }
      - { part: roll, name: "Roll another name" }
      - { part: cancel, name: "Cancel" }
      - { part: accept, name: "Create" }
      - { part: accept, disabled: false }
    screenshot: true

  - name: "New list Enter creates the list with the typed name"
    only: [desktop]
    props: { dataset: standard, open: newList, initialName: "Golden Oasis" }
    steps:
      - { action: type, part: field, text: "Trip ideas" }
      - { action: key, part: field, key: Enter }
    expect:
      - { event: answered, times: 1, last: { action: accept, text: "Trip ideas" } }
      - { event: changed, times: 1, last: { kind: list-created, name: "Trip ideas" } }

  - name: "New list Enter accepts the trimmed typed name"
    only: [desktop]
    props: { dataset: standard, open: newList, initialName: "Golden Oasis" }
    steps:
      - { action: type, part: field, text: "  Groceries  " }
      - { action: key, part: field, key: Enter }
    expect:
      - { event: answered, times: 1, last: { action: accept, text: "Groceries" } }

  - name: "New list Create button accepts the trimmed name"
    only: [desktop]
    props: { dataset: standard, open: newList, initialName: "Golden Oasis" }
    steps:
      - { action: type, part: field, text: "  Trip  " }
      - { action: press, part: accept }
    expect:
      - { event: answered, times: 1, last: { action: accept, text: "Trip" } }
      - { event: changed, times: 1, last: { kind: list-created, name: "Trip" } }

  - name: "New list with an empty name disables Create and Enter only refocuses the field"
    only: [desktop]
    props: { dataset: standard, open: newList, initialName: "Golden Oasis" }
    steps:
      - { input: selectAll, part: field }
      - { action: key, part: field, key: Backspace }
      - { action: key, part: field, key: Enter }
    expect:
      - { part: field, name: "New list", text: "" }
      - { part: accept, disabled: true }
      - { part: field, focused: true }
      - { event: answered, times: 0 }
      - { event: changed, times: 0 }
    screenshot: true   # shows the placeholder "New list" in the empty field

  - name: "New list with a spaces-only name counts as empty"
    only: [desktop]
    props: { dataset: standard, open: newList, initialName: "Golden Oasis" }
    steps:
      - { input: selectAll, part: field }
      - { action: type, part: field, text: "   " }
      - { action: key, part: field, key: Enter }
    expect:
      - { part: accept, disabled: true }
      - { event: answered, times: 0 }
      - { event: changed, times: 0 }

  - name: "New list Roll another name fills the field and keeps focus"
    only: [desktop]
    props: { dataset: standard, open: newList, initialName: "Golden Oasis" }
    steps:
      - { action: press, part: roll }
    expect:
      - { part: field, focused: true }
      - { part: field, text: { matches: '\S' } }   # the rolled value is not known; only non-empty is asserted
      - { event: changed, times: 0 }

  - name: "New list Cancel closes with nothing created"
    only: [desktop]
    props: { dataset: standard, open: newList, initialName: "Golden Oasis" }
    steps:
      - { action: type, part: field, text: "Something" }
      - { action: press, part: cancel }
    expect:
      - { event: answered, times: 1, last: { action: dismiss, text: "" } }
      - { event: changed, times: 0 }

  - name: "New list Escape closes with nothing created"
    only: [desktop]
    props: { dataset: standard, open: newList, initialName: "Golden Oasis" }
    steps:
      - { action: type, part: field, text: "Something" }
      - { action: key, part: field, key: Escape }
    expect:
      - { event: answered, times: 1, last: { action: dismiss, text: "" } }
      - { event: changed, times: 0 }

  - name: "New list typing after a roll replaces the rolled name"
    only: [desktop]
    props: { dataset: standard, open: newList, initialName: "Golden Oasis" }
    steps:
      - { action: press, part: roll }
      - { input: selectAll, part: field }
      - { action: type, part: field, text: "Q" }
    expect:
      - { part: field, text: "Q" }
      - { part: field, focused: true }

  - name: "A new list starts with a rolled list name"
    only: [desktop]
    props: { dataset: standard, open: newList, initialName: "" }
    expect:
      - { part: field, text: { matches: '^[A-Z][a-z]+( [A-Z][a-z]+)?$' } }   # pattern inferred from sample names, see notes
      - { part: field, focused: true }

