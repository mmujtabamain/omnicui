[package]
name = "taskscape-gpui"
version = "0.1.0"
edition = "2021"
description = "Taskscape's main window and capture bar, native in GPUI"
publish = false

[lib]
name = "taskscape_gpui"
path = "src/lib.rs"

[[bin]]
name = "taskscape-gpui"
path = "src/main.rs"

[dependencies]
# Zed's UI framework, the published crate (see README.md for why this version).
gpui = "=0.2.2"
taskscape-common = { path = "../tauri/common" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
smallvec = "1"

[profile.dev]
opt-level = 1
# Line tables only, and no incremental cache: the build folder stays a few GB.
debug = "line-tables-only"
incremental = false
[profile.dev.package."*"]
opt-level = 2
debug = false
