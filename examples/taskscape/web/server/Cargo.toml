[package]
name = "taskscape-web-server"
version = "0.1.0"
edition = "2021"
description = "Taskscape for the web: taskscape_common's Store over HTTP (its data_router, plus what the app's commands need) and the built frontend"
publish = false

[[bin]]
name = "taskscape-web"
path = "src/main.rs"

[features]
# A fixture loader and a domain-event log for the omnicui target. Off in a normal build: the
# server then has no way to swap its data folder or report what users do.
test-hooks = ["dep:taskscape-fixtures"]

[dependencies]
taskscape-common = { path = "../../tauri/common" }
taskscape-fixtures = { path = "../../omnicui/fixtures", optional = true }
anyhow = "1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
