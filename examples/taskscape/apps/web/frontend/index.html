<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Taskscape</title>
    <!-- The window's own colour from the first paint, before the styles and the app load, so a reload
         never flashes white (surface-1 of the tokens, light and dark). -->
    <style>
      html, body { margin: 0; background: oklch(0.968 0.002 255); }
      @media (prefers-color-scheme: dark) { html, body { background: oklch(0.205 0.004 260); } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
