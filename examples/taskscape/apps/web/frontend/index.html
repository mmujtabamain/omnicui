<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Taskscape</title>
    <!-- The window's own colour from the first paint, before the styles and the app load, so a reload
         never flashes white (surface-1 of the tokens, light and dark). -->
    <style>
      html, body { margin: 0; background: oklch(0.968 0.002 255); }
      @media (prefers-color-scheme: dark) { html, body { background: oklch(0.205 0.004 260); } }

      /* Loading, as in the reference: a blurred veil over the mounting app with a rounded box whose tick
         draws in on a loop. src/lib/boot.ts fades the veil out once the first data has arrived, and the app
         fades in behind it. The --boot-* values stand in for the tokens until the stylesheet loads. It plays
         under reduced motion too (brief, one-shot feedback): the id selectors and !important outweigh the
         tokens' clamp. */
      :root { --boot-bg: oklch(0.968 0.002 255); --boot-edge: oklch(0.32 0.02 260 / 0.3); --boot-ink: oklch(0.62 0.013 264); }
      @media (prefers-color-scheme: dark) {
        :root { --boot-bg: oklch(0.205 0.004 260); --boot-edge: oklch(0.98 0.01 260 / 0.24); --boot-ink: oklch(0.57 0.011 262); }
      }
      #boot {
        position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center;
        background-color: color-mix(in oklab, var(--surface-1, var(--boot-bg)) 62%, transparent);
        -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
      }
      #root:empty { opacity: 0; }
      #root:not(:empty) { animation: app-in 1000ms cubic-bezier(0.2, 0, 0, 1) both !important; }
      @keyframes app-in { from { opacity: 0; } }
      #boot .boot-box { stroke: var(--edge-3, var(--boot-edge)); }
      #boot .boot-tick {
        stroke: var(--content-3, var(--boot-ink)); stroke-dasharray: 18;
        animation: boot-tick 1.7s cubic-bezier(0.2, 0, 0, 1) infinite !important;
      }
      @keyframes boot-tick {
        0% { stroke-dashoffset: 18; opacity: 1; }
        38% { stroke-dashoffset: 0; }
        62% { stroke-dashoffset: 0; opacity: 1; }
        80% { opacity: 0; }
        100% { stroke-dashoffset: 18; opacity: 0; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot" role="status" aria-label="Loading Taskscape">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true">
        <rect class="boot-box" x="1.5" y="1.5" width="25" height="25" rx="7" fill="none" stroke-width="1.5" />
        <path class="boot-tick" d="M8.2 14.6 L12.4 18.6 L19.8 9.9" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
