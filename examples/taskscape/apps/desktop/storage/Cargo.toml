[package]
name = "taskscape-storage"
version = "0.1.0"
edition = "2021"
description = "Taskscape's storage, from the reference app's shared crate: SQLite through SeaORM, Atlas migrations, settings, attachments, hotkeys and screenshots."
publish = false

[lib]
name = "taskscape_storage"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
sea-orm = { version = "1", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros"] }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
include_dir = "0.7"
uuid = { version = "1", features = ["v4"] }
dirs = "5"
tokio = { version = "1", features = ["full"] }

# Screen capture on Linux under X11: a grab of the root window, written as a PNG (no external tool).
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"
png = "0.18"
