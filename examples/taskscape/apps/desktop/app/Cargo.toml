[package]
name = "taskscape-app"
version = "0.1.0"
edition = "2024"
description = "The Taskscape desktop app: its data (on the reference's storage), its state, its screens and windows (egui), and the eframe binary."
publish = false

[lib]
name = "taskscape_app"
path = "src/lib.rs"

[[bin]]
name = "taskscape"
path = "src/main.rs"
required-features = ["window"]

# The window needs eframe; the screens don't. The omnicui target turns `window` off and never builds eframe.
[features]
default = ["window"]
window = ["dep:eframe", "dep:rfd", "dep:muda", "dep:objc2", "dep:objc2-app-kit", "dep:raw-window-handle"]

[dependencies]
taskscape-ui = { path = "../ui" }
taskscape-storage = { path = "../storage" }
egui = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
anyhow = "1"
# OS file dialogs (list import and export); the portal backend on Linux needs no GTK.
rfd = { version = "0.15", optional = true, default-features = false, features = ["xdg-portal", "async-std"] }
eframe = { version = "0.37", optional = true, default-features = false, features = ["accesskit", "default_fonts", "wgpu", "wayland", "x11"] }

# The macOS menu bar (App, View, Window, List), as the reference's.
[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.17", optional = true }
# Native title bar buttons and window dragging.
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", optional = true, default-features = false, features = ["std", "NSApplication", "NSButton", "NSControl", "NSResponder", "NSView", "NSWindow"] }
raw-window-handle = { version = "0.6", optional = true }
