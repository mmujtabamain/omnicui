[package]
name = "taskscape-ui"
version = "0.1.0"
edition = "2024"
description = "Taskscape's desktop widget library in egui: the same widgets and contracts as the web's packages/ui."
publish = false

[lib]
name = "taskscape_ui"
path = "src/lib.rs"

[dependencies]
egui = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
