# yaml-language-server: $schema=../../../tools/omnicui/schema/contract.schema.json
id: ui.counter

props:
  start: { type: integer, default: 0 }

events:
  changed:
    count: { type: integer }

parts:
  value:     { role: status }
  increment: { role: button }

tests:
  - name: starts at the start value
    props: { start: 5 }
    expect:
      - { part: value, text: { matches: "^5\\b" } }   # experiment E: the number, then anything
    screenshot: true

  - name: each press adds one
    steps:
      - { action: press, part: increment, times: 3 }
    expect:
      - { part: value, text: { matches: "^3\\b" } }
      - { event: changed, times: 3, last: { count: 3 } }
    screenshot: true

  - name: the keyboard works too
    steps:
      - { action: focus, part: increment }
      - { action: key, part: increment, key: Enter }
    expect:
      - { part: value, text: { matches: "^1\\b" } }
      - { part: increment, name: "Increment" }

keyboard:     true                                  # Enter and Space must do what a press does
viewports:    [{ width: 320, height: 240 }]
colorSchemes: [light, dark]
thresholds:   { area: 30% }
