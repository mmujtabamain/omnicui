name: webalt
language: typescript
# The web app's second design (apps/web/src/components/redesign): a copy of omnicui/targets/web
# (`omnicui add webalt --template omnicui/targets/web`) whose harness.tsx registers the redesigned
# components. It has no stubs: the web target already writes apps/web/src/omnicui.
#
# omnicui runs `adapter:` once per check, with /bin/sh -c (cmd /C on Windows, which drops the
# `exec`), and talks JSON-RPC to it over stdin/stdout. `exec` hands the shell's place to the
# adapter, so that closing its output is seen at once.
adapter: exec node adapter.ts
stepTimeout: 15s
startTimeout: 120s
design: redesign
