name: javafx
language: java
# The app under test: apps/desktop-javafx, a Maven dependency in pom.xml. This folder only mounts
# its components and answers omnicui's requests.
#
# omnicui runs `adapter:` once per check, with /bin/sh -c (cmd /C on Windows, which drops the
# `exec`), and talks JSON-RPC to it over stdin/stdout. `exec` hands the shell's place to the
# adapter, so that closing its output is seen at once.
# Build first: `./mvnw -q -B install` in apps/desktop-javafx, then `./mvnw -q -B package` here
# (the run scripts do both).
adapter: exec java -jar target/omnicui-target-javafx.jar
stepTimeout: 15s
startTimeout: 60s
